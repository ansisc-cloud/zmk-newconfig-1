name: Build ZMK Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install west
        run: |
          pip install west

      - name: Initialize west
        run: |
          west init -l zmk/app
          west update

      - name: Build firmware
        run: |
          west build -s zmk/app -b nice_nano_v2 -- -DSHIELD=bat43

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bat43-nice_nano_v2
          path: build/zephyr/*.uf2
